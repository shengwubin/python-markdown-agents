[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "markdown-agents"
version = "0.1.0"
description = "Middleware that converts HTML responses to Markdown for AI agents — Flask, Django, and FastAPI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Wubin Sheng" }]
keywords = ["markdown", "agents", "middleware", "flask", "django", "fastapi", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Middleware",
]
dependencies = [
    "markdownify>=0.13",
]

[project.optional-dependencies]
flask = ["flask>=2.0"]
django = ["django>=4.0"]
fastapi = ["fastapi>=0.100", "starlette>=0.27"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "flask>=2.0",
    "django>=4.0",
    "fastapi>=0.100",
    "starlette>=0.27",
    "ruff>=0.8",
]

[project.urls]
Homepage = "https://github.com/shengwubin/python-markdown-agents"
Repository = "https://github.com/shengwubin/python-markdown-agents"

[tool.setuptools.packages.find]
include = ["markdown_agents*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["examples"]
